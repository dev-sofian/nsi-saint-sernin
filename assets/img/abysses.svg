<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Fond d'écran original du site : abysses bioluminescentes (inspiré du rice de Sofian, dessiné pour le projet). -->
  <defs>
    <radialGradient id="eau" cx="50%" cy="-10%" r="120%">
      <stop offset="0" stop-color="#16206a"/>
      <stop offset=".45" stop-color="#0c1240"/>
      <stop offset="1" stop-color="#05071a"/>
    </radialGradient>
    <linearGradient id="rayon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a7bff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5a7bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ombrelle" cx="50%" cy="85%" r="75%">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#3f6bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2a1fa8" stop-opacity="0"/>
    </radialGradient>
    <filter id="lueur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brume"><feGaussianBlur stdDeviation="2.5"/></filter>
    <!-- Une méduse : ombrelle + tentacules ondulés -->
    <g id="meduse">
      <path d="M-60 0 C-60 -70 60 -70 60 0 C40 -8 20 6 0 -2 C-20 6 -40 -8 -60 0 Z" fill="url(#ombrelle)"/>
      <path d="M-60 0 C-60 -70 60 -70 60 0" fill="none" stroke="#b9dcff" stroke-opacity=".6" stroke-width="2"/>
      <g fill="none" stroke="#7fa6ff" stroke-linecap="round" stroke-opacity=".55" stroke-width="2">
        <path d="M-40 0 c-10 40 14 70 0 110 s10 70 -6 110"/>
        <path d="M-15 2 c12 45 -14 80 4 130 s-12 60 6 100"/>
        <path d="M12 2 c-10 50 16 70 0 125 s14 55 -4 95"/>
        <path d="M38 0 c12 40 -12 75 4 115 s-10 60 8 90"/>
      </g>
      <g fill="none" stroke="#d03cff" stroke-opacity=".35" stroke-width="1.2">
        <path d="M-5 -4 c6 60 -6 110 3 170"/>
        <path d="M5 -4 c-4 55 8 100 -2 150"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#eau)"/>

  <!-- Rayons de lumière venus de la surface -->
  <g filter="url(#brume)">
    <polygon points="380,0 470,0 760,1000 560,1000" fill="url(#rayon)"/>
    <polygon points="820,0 880,0 1040,1000 930,1000" fill="url(#rayon)" opacity=".7"/>
    <polygon points="1180,0 1250,0 1500,1000 1360,1000" fill="url(#rayon)" opacity=".5"/>
  </g>

  <!-- Méduses (taille et profondeur variées) -->
  <g filter="url(#lueur)">
    <use href="#meduse" transform="translate(1260 300) rotate(12) scale(1.35)"/>
    <use href="#meduse" transform="translate(250 620) rotate(-14) scale(.9)" opacity=".75"/>
    <use href="#meduse" transform="translate(860 170) rotate(5) scale(.55)" opacity=".55"/>
    <use href="#meduse" transform="translate(1480 760) rotate(-8) scale(.45)" opacity=".4"/>
  </g>

  <!-- Particules en suspension -->
  <g fill="#9fbaff">
    <circle cx="120" cy="140" r="1.6" opacity=".5"/><circle cx="330" cy="360" r="1.1" opacity=".4"/>
    <circle cx="610" cy="90" r="1.3" opacity=".5"/><circle cx="700" cy="520" r="1" opacity=".35"/>
    <circle cx="980" cy="430" r="1.7" opacity=".45"/><circle cx="1110" cy="640" r="1.1" opacity=".4"/>
    <circle cx="1420" cy="120" r="1.4" opacity=".5"/><circle cx="1530" cy="470" r="1" opacity=".35"/>
    <circle cx="430" cy="850" r="1.5" opacity=".4"/><circle cx="820" cy="900" r="1.2" opacity=".3"/>
    <circle cx="1210" cy="900" r="1.6" opacity=".35"/><circle cx="60" cy="760" r="1.2" opacity=".35"/>
  </g>
  <g fill="#d03cff">
    <circle cx="540" cy="250" r="1.4" opacity=".5"/><circle cx="1350" cy="560" r="1.2" opacity=".45"/>
  </g>
</svg>
