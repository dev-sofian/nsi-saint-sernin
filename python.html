<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="barre">
    <nav class="espaces" aria-label="Espaces de travail">
      <a href="index.html" class="ws ws-accueil" title="Accueil">nsi</a>
      <a href="cours.html" class="ws" data-raccourci="1" title="Cours (Alt+1)"><b>1</b><span>cours</span></a>
      <a href="visio.html" class="ws" data-raccourci="2" title="Salle de classe (Alt+2)"><b>2</b><span>classe</span></a>
      <a href="python.html" class="ws" data-raccourci="3" title="Python (Alt+3)"><b>3</b><span>python</span></a>
      <a href="admin.html" class="ws ws-admin" data-raccourci="4" title="Administration (Alt+4)" hidden><b>4</b><span>admin</span></a>
    </nav>
    <span id="etat-serveur" class="etat-serveur" role="img" aria-label="État du serveur de visio"></span>
    <div class="barre-droite">
      <div id="zone-compte" class="zone-compte"></div>
      <time id="horloge" class="pastille horloge"></time>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <button id="btn-executer" class="btn primary" disabled>▶ Exécuter</button>
      <label class="btn">
        📂 Ouvrir un .py
        <input type="file" id="fichier" accept=".py,.txt" hidden>
      </label>
      <button id="btn-telecharger" class="btn">💾 Télécharger</button>
      <button id="btn-effacer" class="btn">🧹 Effacer la console</button>
      <button id="btn-mon-code" class="btn actif" hidden title="Remettre le code que tu avais avant d'ouvrir l'exemple du cours">↩ Revenir à mon code</button>
      <span id="statut" class="muted">Chargement de Python…</span>
    </div>

    <div class="ide">
      <div class="editeur-wrap">
        <textarea id="editeur"># Écris ton code ici
def carre(n):
    return n * n

for i in range(5):
    print(i, "->", carre(i))
</textarea>
      </div>
      <pre id="console" class="console"></pre>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script src="assets/js/python.js"></script>

  <script type="module" src="assets/js/barre.js"></script>
